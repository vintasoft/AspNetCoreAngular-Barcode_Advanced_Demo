<div class="modal-header">
  <h4 class="modal-title">GS1 Value Editor</h4>
</div>
<div class="modal-body">
  <div class="modalDialogBodyContent">
    <label for="gs1PrintableValue">GS1 printable value:</label>
    <br />
    <input type="text" id="gs1PrintableValue" style="width: 450px;" tabindex="-1" value="(01)01234567890128" readonly />
    <br />
    <br />
    <label for="gs1Value">GS1 value (set of GS1 Application Identifier values):</label>
    <br />
    <table id="gs1Value" border="1" style="width: 450px;">
      <tr>
        <th>AI</th>
        <th>AI name</th>
        <th>AI data</th>
        <th>Actions</th>
      </tr>
      <tr>
        <td>01</td>
        <td>GTIN</td>
        <td>01234567890128</td>
        <td style="text-align: center;"><input type="button" value="Edit" /> <input type="button" value="Delete" /></td>
      </tr>
    </table>
    <br />
    <input type="button" value="Add GS1 Application Identifier value to GS1 value" (click)="addGs1AppIdValueToGs1Value()" />
  </div>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-primary" (click)="copyGs1PrintableValueToClipboad()">Copy GS1 printable value to the clipboard</button>
  <button type="button" class="btn btn-outline-dark" (click)="closeDialog()">OK</button>
</div>
